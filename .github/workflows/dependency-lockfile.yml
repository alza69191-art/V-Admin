name: Dependency lockfile and security audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate deterministic lockfile
        run: npm install --package-lock-only

      - name: Install exactly from lockfile
        run: npm ci

      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high

      - name: Production build
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 4000
          DB_USER: ci
          DB_PASSWORD: ci-placeholder
          DB_NAME: vcommerce_ci
          DB_SSL: "false"
        run: npm run build

      - name: Commit generated lockfile and Next.js optional SWC entries
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add deterministic npm lockfile"
          git push
