services:
  - type: web
    name: v-admin-api
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/alza69191-art/V-Admin
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
  - type: web
    name: v-storefront
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/alza69191-art/V-Storefront
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: ADMIN_API_URL
        value: https://v-admin-api.onrender.com
      - key: NODE_VERSION
        value: "20"
